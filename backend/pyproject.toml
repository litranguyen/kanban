[project]
name = "kanban-backend"
version = "0.1.0"
description = "FastAPI backend for the Kanban MVP"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.23.0",
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
  "httpx>=0.25.0",
]

[tool.pytest.ini_options]
addopts = "--cov=backend --cov-report=term-missing --cov-report=html --cov-fail-under=80"
testpaths = ["tests"]
